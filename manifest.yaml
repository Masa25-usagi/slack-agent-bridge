display_information:
  name: Masa Agent Bridge
  description: Private, allowlisted bridge to Codex and AntiGravity
  background_color: "#1f2937"
features:
  bot_user:
    display_name: Masa Agent Bridge
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - files:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
